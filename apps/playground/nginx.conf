server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Each route prerenders to its own directory, so /vue resolves to /vue/index.html.
  # 200.html is Nuxt's SPA fallback, used for anything not prerendered - a link carrying
  # a query or a hash still lands on a working app rather than an nginx 404 page.
  location / {
    try_files $uri $uri/ /200.html;
  }

  # almostnode's service worker. NEVER cache this for long.
  #
  # Browsers revalidate worker scripts, but an aggressive Cache-Control pins a stale one,
  # and the symptom is that node mode simply stops picking up changes - with nothing in
  # the console to say why. This is the single most annoying thing to debug on this stack,
  # so it is nailed down here rather than left to a default.
  location = /__sw__.js {
    add_header Cache-Control "no-cache";
  }

  # Content-hashed: the filename changes when the content does, so these can be cached
  # forever. /assets/ holds almostnode's runtime worker, /_nuxt/ everything Vite emitted.
  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # HTML is not hashed, so it must be revalidated or a deploy goes unnoticed.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
