<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground preview</title>
  <!-- Nothing here should ever be indexed or navigated to directly; it is a frame target. -->
  <meta name="robots" content="noindex, nofollow">
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #status {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; margin: 0;
      font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
      color: #b00020; background: #fff; white-space: pre-wrap; text-align: center;
    }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- The student's document lives in here. The shim itself never navigates, so it keeps
       receiving messages across every re-render. -->
  <iframe id="stage" title="Preview"></iframe>
  <p id="status" hidden></p>
  <script type="module" src="./main.js"></script>
</body>
</html>
