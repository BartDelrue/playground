server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Two files, neither content-hashed, both of which change when the shim changes - so
  # neither may be cached hard. A stale shim shows up as a preview that silently renders
  # the wrong thing, which is not a debugging session anyone enjoys.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  # This origin exists to be framed by the playground, which is a different origin.
  # Nothing here is secret - it runs whatever the editor sends it - so allowing any
  # origin to read it costs nothing and keeps development (a different host and port)
  # working against the deployed shim.
  add_header Access-Control-Allow-Origin "*";

  gzip on;
  gzip_types text/html application/javascript;
  gzip_min_length 1024;
}
